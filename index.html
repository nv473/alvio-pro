<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام ترويج الأرقام · قريباً</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== جميع الأنماط من التطبيق الأصلي ========== */
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #00ff9d;
            --dark: #0c0b1e;
            --light: #ffffff;
            --card-bg: linear-gradient(145deg, #1a1a2e, #16213e);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, #1a1036 100%);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* ========== خلفية متحركة ========== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            animation: floatCircle 25s infinite ease-in-out;
            opacity: 0.08;
        }

        .circle:nth-child(1) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #6a11cb, transparent);
            top: -150px;
            right: -150px;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #2575fc, transparent);
            bottom: -200px;
            left: -200px;
            animation-delay: -8s;
        }

        .circle:nth-child(3) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #00ff9d, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes floatCircle {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -40px) scale(1.1); }
            50% { transform: translate(-30px, 60px) scale(0.9); }
            75% { transform: translate(40px, 30px) scale(1.05); }
        }

        /* ========== البطاقة الرئيسية (نفس ديزاين التطبيق) ========== */
        .main-card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border-radius: 40px;
            padding: 45px 35px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: cardAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: scale(0.9) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ========== شعار التطبيق (نفس الأصلي) ========== */
        .app-logo {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .app-logo h1 {
            color: var(--accent);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 2px 10px rgba(106, 17, 203, 0.3);
        }

        .app-logo p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        /* ========== الأيقونة ========== */
        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: var(--gradient-1);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            box-shadow: 0 12px 35px rgba(106, 17, 203, 0.35);
            animation: pulseIcon 2.5s infinite ease-in-out;
        }

        .icon-wrapper i {
            animation: spinGear 10s linear infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); box-shadow: 0 12px 35px rgba(106, 17, 203, 0.35); }
            50% { transform: scale(1.04); box-shadow: 0 20px 50px rgba(106, 17, 203, 0.55); }
        }

        @keyframes spinGear {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== العنوان ========== */
        .title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--light);
            margin-bottom: 8px;
        }

        .title .highlight {
            background: linear-gradient(135deg, #00ff9d, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .subtitle span {
            color: var(--accent);
            font-weight: 600;
        }

        /* ========== خط التقدم ========== */
        .progress-container {
            margin: 20px 0 25px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--gradient-1);
            border-radius: 10px;
            animation: progressLoad 3.5s ease-in-out infinite;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 25px;
            background: rgba(255, 255, 255, 0.25);
            filter: blur(5px);
            border-radius: 10px;
        }

        @keyframes progressLoad {
            0% { width: 0%; }
            25% { width: 35%; }
            50% { width: 65%; }
            75% { width: 88%; }
            100% { width: 100%; }
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.35);
        }

        .progress-label .percentage {
            color: var(--accent);
            font-weight: 700;
        }

        /* ========== النقاط المتحركة (نفس الأصلي) ========== */
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 20px 0 25px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--gradient-1);
            animation: dotBounce 1.5s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(106, 17, 203, 0.25);
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.25s; }
        .dot:nth-child(3) { animation-delay: 0.5s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 30px rgba(0, 255, 157, 0.4); }
        }

        /* ========== المميزات (4 بطاقات) ========== */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0 25px;
        }

        .feature-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 18px 14px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .feature-box:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
            border-color: rgba(0, 255, 157, 0.15);
        }

        .feature-box i {
            font-size: 1.6rem;
            color: var(--accent);
            display: block;
            margin-bottom: 8px;
        }

        .feature-box .f-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--light);
            display: block;
        }

        .feature-box .f-desc {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            display: block;
            margin-top: 3px;
        }

        /* ========== الفوتر ========== */
        .footer {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            transition: 0.3s;
        }

        .footer a:hover {
            color: var(--accent);
        }

        .footer .divider {
            color: rgba(255, 255, 255, 0.05);
        }

        /* ========== شريط التمرير ========== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--gradient-1); border-radius: 10px; }

        /* ========== التجاوب ========== */
        @media (max-width: 480px) {
            .main-card {
                padding: 30px 22px 28px;
                border-radius: 30px;
            }

            .app-logo h1 {
                font-size: 1.1rem;
            }

            .icon-wrapper {
                width: 65px;
                height: 65px;
                font-size: 2rem;
                border-radius: 20px;
            }

            .title {
                font-size: 1.6rem;
            }

            .subtitle {
                font-size: 0.9rem;
            }

            .features-grid {
                gap: 10px;
            }

            .feature-box {
                padding: 14px 10px;
            }

            .feature-box i {
                font-size: 1.3rem;
            }

            .feature-box .f-title {
                font-size: 0.75rem;
            }

            .footer {
                gap: 10px;
                font-size: 0.65rem;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 360px) {
            .main-card {
                padding: 22px 16px 22px;
                border-radius: 24px;
            }

            .title {
                font-size: 1.3rem;
            }

            .icon-wrapper {
                width: 55px;
                height: 55px;
                font-size: 1.6rem;
                border-radius: 16px;
            }

            .features-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .feature-box {
                padding: 12px 8px;
            }

            .loading-dots {
                gap: 10px;
            }

            .dot {
                width: 11px;
                height: 11px;
            }
        }

        /* منع النسخ */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- خلفية متحركة -->
    <div class="bg-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- ===== البطاقة الرئيسية ===== -->
    <div class="main-card">

        <!-- شعار التطبيق (نفس الأصلي) -->
        <div class="app-logo">
            <h1><i class="fas fa-network-wired"></i> نظام ترويج الأرقام</h1>
            <p>شارك الأرقام وحصل على مستفيدين من حسابك</p>
        </div>

        <!-- الأيقونة -->
        <div class="icon-wrapper">
            <i class="fas fa-code"></i>
        </div>

        <!-- العنوان -->
        <h1 class="title">
            <span class="highlight">قريباً</span>
        </h1>

        <p class="subtitle">
            <i class="fas fa-cogs" style="color: var(--accent); margin-left: 8px;"></i>
            <span>نظام ترويج الأرقام</span> قيد التطوير حالياً
            <br>
            سيصبح متاحاً قريباً
        </p>

        <!-- بار التقدم -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-label">
                <span><i class="fas fa-spinner fa-spin"></i> جاري التطوير</span>
                <span class="percentage">%99</span>
            </div>
        </div>

        <!-- النقاط المتحركة (نفس التطبيق) -->
        <div class="loading-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- المميزات -->
        <div class="features-grid">
            <div class="feature-box">
                <i class="fas fa-share-alt"></i>
                <span class="f-title">مشاركة فورية</span>
                <span class="f-desc">شارك أرقامك بسهولة</span>
            </div>
            <div class="feature-box">
                <i class="fas fa-users"></i>
                <span class="f-title">مستفيدين</span>
                <span class="f-desc">ابنِ شبكتك الخاصة</span>
            </div>
            <div class="feature-box">
                <i class="fas fa-qrcode"></i>
                <span class="f-title">كود ترويج</span>
                <span class="f-desc">لكل مستخدم كوده</span>
            </div>
            <div class="feature-box">
                <i class="fas fa-shield-alt"></i>
                <span class="f-title">آمن ومحمي</span>
                <span class="f-desc">بياناتك بأمان</span>
            </div>
        </div>

        <!-- فوتر -->
        <div class="footer">
            <span><i class="fas fa-code-branch"></i> الإصدار 2.0</span>
            <span class="divider">·</span>
            <span><i class="fas fa-calendar-alt"></i> قريباً</span>
            <span class="divider">·</span>
            <span style="color: rgba(0, 255, 157, 0.25);"><i class="fas fa-rocket"></i> v.2.0.0</span>
        </div>
    </div>

    <script>
        // ===== منع النسخ =====
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && ['c', 'C', 'v', 'V', 'x', 'X', 'u', 'U'].includes(e.key)) {
                e.preventDefault();
            }
        });

        // ===== رسالة في الكونسول =====
        console.log('🚀 نظام ترويج الأرقام - قيد التطوير');
        console.log('📅 الإصدار 2.0 سيصدر قريباً');
    </script>

</body>
</html>
